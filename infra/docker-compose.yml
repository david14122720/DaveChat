services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: davechat-api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_DSN: "davechat:davechat_pass@tcp(192.168.101.133:3307)/davechat?parseTime=true&charset=utf8mb4&loc=UTC"
      JWT_SECRET: "change-me-in-production"
      ALLOWED_ORIGINS: "*"